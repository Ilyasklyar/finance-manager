services:
  postgres:
    image: postgres:18
    container_name: finance-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance_manager
      POSTGRES_PASSWORD: finance_manager
      POSTGRES_DB: finance_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: